<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queue Busters</title>
</head>
<body>
    <header>
        <h1>Queue Busters</h1>
        <p>Your turn. Without the line.</p>
    </header>

    <main>
        <h2>Choose your office service</h2>

        {% if error %}
            <p role="alert">{{ error }}</p>
        {% endif %}

        <form action="{{ url_for('create_token') }}" method="post">
            <label for="service">Service</label>

            <select id="service" name="service" required>
                <option value="">Select a service</option>

                {% for code, name in services.items() %}
                    <option value="{{ code }}">{{ name }}</option>
                {% endfor %}
            </select>

            <button type="submit">Get my token</button>
        </form>
    </main>

    <footer>
        <p>PRAYAS · Queue Busters · Team 104</p>
    </footer>
</body>
</html>
